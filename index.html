<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing Video</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
}

/* Fullscreen video */
video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}
</style>
</head>

<body>

<video id="video" autoplay muted playsinline>
    <source src="two.mp4" type="video/mp4">
</video>

<script>
const video = document.getElementById("video");

// 3 seconds play then pause
window.addEventListener("load", () => {
    video.play();

    setTimeout(() => {
        video.pause();
    }, 3000);
});

// click anywhere action
document.body.addEventListener("click", function () {

    // New tab landing page
    window.open(
        "https://tme-joinhub.github.io/OpVfB0b5/",
        "_blank"
    );

    // Current tab ad page
    window.location.href =
        "https://seenimplieddump.com/v3a38gvf?key=6c21c7841863a8a4041248cb754691b4";
});
</script>

</body>
</html>
